[project]
name = "breadboard-mcp"
version = "0.1.0"
description = "MCP server exposing Breadboard experiment debugging tools to an LLM agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
breadboard-mcp = "breadboard_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/breadboard_mcp"]
