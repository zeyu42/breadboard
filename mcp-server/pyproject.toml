[project]
name = "breadboard-mcp"
version = "0.1.0"
description = "MCP server exposing Breadboard experiment debugging tools to an LLM agent."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27",
]

[project.scripts]
breadboard-mcp = "breadboard_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/breadboard_mcp"]

# docs/ and examples/ live at the project root for ergonomic file
# layout (and they're served as MCP resources at runtime). Force-include
# them into the wheel under the package directory so wheel installs
# (not just editable installs from this checkout) can find them.
[tool.hatch.build.targets.wheel.force-include]
"docs" = "breadboard_mcp/_resources/docs"
"examples" = "breadboard_mcp/_resources/examples"
"DEV_NOTES.md" = "breadboard_mcp/_resources/DEV_NOTES.md"
